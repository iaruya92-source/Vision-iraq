{% extends 'base.html' %}
{% block title %}التحقق{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo">
                    <div class="logo-icon">V</div>
                    <span>Vision</span>
                </div>
                <h1>التحقق من الرقم</h1>
                <p>أدخل الرمز المكون من 6 أرقام المرسل إلى <strong>{{ phone }}</strong></p>
            </div>
            
            <form method="POST" action="{{ url_for('auth.verify') }}" class="auth-form">
                <div class="form-group">
                    <label>رمز التحقق</label>
                    <input type="text" name="code" maxlength="6" placeholder="000000" required autofocus class="otp-input">
                </div>
                
                <button type="submit" class="btn-primary btn-full">
                    <i class="fas fa-check"></i>
                    تحقق
                </button>
            </form>
            
            <form method="POST" action="{{ url_for('auth.resend_otp') }}" class="resend-form">
                <button type="submit" class="btn-text">إعادة إرسال الرمز</button>
            </form>
            
            <div class="auth-footer">
                <a href="{{ url_for('auth.login') }}"><i class="fas fa-arrow-right"></i> تغيير رقم الهاتف</a>
            </div>
        </div>
        
        <div class="auth-visual">
            <div class="auth-pattern"></div>
            <div class="auth-content">
                <h2>تأمين حسابك</h2>
                <p>نستخدم رمز التحقق لحماية حسابك وضمان أمان بياناتك</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
