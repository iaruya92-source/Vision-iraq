services:
  - type: web
    name: vision-classifieds
    env: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vision-db
          property: connectionString

databases:
  - name: vision-db
    plan: free
    databaseName: vision_classifieds
    user: vision_user
